name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai thu vien
        run: npm install

      - name: Tao project Android
        run: npx cap add android

      - name: Them quyen Bluetooth va khoa ky
        run: python3 scripts/patch_android.py

      - name: Dong bo giao dien vao app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PATH: ${{ github.workspace }}/hub-release.keystore
        run: ./gradlew assembleRelease --no-daemon

      - name: Doi ten APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hub-control.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hub-control-apk
          path: hub-control.apk

      - name: Dang ban phat hanh
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: App build ${{ github.run_number }}
          files: hub-control.apk
